compressionLevel: mixed

enableColors: true

enableGlobalCache: true

nmHoistingLimits: workspaces

nodeLinker: node-modules

# Disabled for the hackathon: yarn's npm age-gate quarantines any package version
# published within the window below, and npmPreapprovedPackages (the documented
# escape hatch) still didn't unblock `viem@2.55.5` in CI — likely the duration-suffix
# parsing bug tracked upstream. A CI that breaks every time someone bumps a dependency
# is a worse risk than the supply-chain protection this buys during a 3-day build.
# Worth re-enabling post-hackathon.
npmMinimalAgeGate: 0

npmPreapprovedPackages:
  - "@scaffold-ui/components"
  - "@scaffold-ui/debug-contracts"
  - "@scaffold-ui/hooks"
  - "@privy-io/wagmi"
  - viem

yarnPath: .yarn/releases/yarn-4.13.0.cjs
